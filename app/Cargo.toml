[package]
name = "fubuki"
version = "1.1.0"
edition = "2024"
resolver = "3"

[dependencies]
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tokio-util = { version = "0.7.19", features = ["io"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
clap = { version = "4.6.3", features = ["derive"] }
scraper = "0.27.0"
url = "2.5.8"
futures = "0.3.33"

# https://docs.obscura.sh/guides/use-as-a-rust-library
obscura = { git = "https://github.com/h4ckf0r0day/obscura" }

[build-dependencies]
winres = "0.1.12"
